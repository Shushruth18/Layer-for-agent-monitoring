# Agent Monitor policy rules.
# Deterministic rules run first (fast, free). If none fires but personal data is present,
# the judge LLM (via Otari) is asked. Decisions: block > flag > allow.

# Presidio entities that count as "personal data"
personal_data_entities: [PERSON, EMAIL_ADDRESS, PHONE_NUMBER, IBAN_CODE, CREDIT_CARD, IP_ADDRESS]
min_score: 0.4

# Destinations considered inside the EU/EEA (or with an adequacy decision)
eu_destinations: [eu-central, eu-west, eu-north, eu-south, eu, de, fr, nl, ie, se]

# Where tools send data when the agent doesn't say (mirrors the tool server's defaults)
tool_destinations:
  send_to_crm: us-east

# Custom Presidio recognizers for GDPR Art. 9 special categories (deny lists, case-insensitive)
special_categories:
  HEALTH_DATA:
    - cancer
    - chemotherapy
    - medical leave
    - sick leave
    - diabetes
    - diabetic
    - pregnant
    - pregnancy
    - depression
    - burnout
    - therapy
    - disability
    - disabled
    - hiv
    - surgery
    - diagnosis
    - diagnosed
    - illness
  RELIGION:
    - muslim
    - christian
    - catholic
    - protestant
    - jewish
    - hindu
    - buddhist
    - atheist
    - friday prayers
    - prayers
    - mosque
    - church
    - synagogue
    - ramadan
    - kosher
    - halal
  ETHNICITY:
    - ethnicity
    - ethnic origin
    - racial origin
    - roma
    - sinti

rules:
  - id: special_category_data
    kind: special_category
    applies_to: [tool_call]
    entities: [HEALTH_DATA, RELIGION, ETHNICITY]
    decision: block
    severity: high
    framework: GDPR
    article: Art. 9
    explanation: >-
      Health, religious or ethnic data is "special category" data. Processing it is prohibited
      unless an explicit exception (e.g. explicit consent) applies, which a sales agent never has.

  - id: third_country_transfer
    kind: transfer
    applies_to: [tool_call]
    decision: block
    severity: high
    framework: GDPR
    article: Art. 44
    explanation: >-
      Personal data was about to be sent outside the EU without a documented transfer safeguard
      (adequacy decision, SCCs). International transfers must meet Chapter V GDPR.

  - id: automated_rejection
    kind: automated_decision
    applies_to: [tool_call]
    tools: [decide_on_lead]
    field: decision
    negative_values: [reject, rejected, disqualify, decline, declined]
    human_review_field: human_review
    decision: flag
    severity: medium
    framework: GDPR
    article: Art. 22 + AI Act Art. 14
    explanation: >-
      A person was rejected by the AI alone. People have the right not to be subject to solely
      automated decisions with significant effect, and high-risk AI needs human oversight.

  - id: data_minimisation
    kind: data_minimisation
    applies_to: [tool_call]
    tools: [save_profile]
    allowed_fields: [lead_id, id, name, title, company, email, fit_score, city, country, employees]
    decision: flag
    severity: low
    framework: GDPR
    article: Art. 5(1)(c)
    explanation: >-
      More personal fields were stored than needed for the purpose (data minimisation).

  - id: ai_disclosure
    kind: ai_disclosure
    applies_to: [tool_call]
    tools: [send_email]
    field: body
    # Must actually disclose AI involvement; a mention like "AI-audit trail" doesn't count.
    disclosure_pattern: '(\bAI[ -](assistant|agent|system|sales assistant)\b|(written|generated|drafted|sent) (by|with|using) (an? )?(AI|bot|artificial intelligence)\b|\bI am an AI\b|\bI''m an AI\b|automated (assistant|system|message))'
    decision: flag
    severity: medium
    framework: EU AI Act
    article: Art. 50
    explanation: >-
      A person was contacted by an AI system without being told they are interacting with AI.

company_policy:
  - id: no_email_to_competitors
    kind: blocked_recipient_domain
    applies_to: [tool_call]
    tools: [send_email]
    field: to
    domains: [rivalmonitor.ai, compliancebot.com, auditly.eu]
    decision: block
    severity: high
    framework: Company policy
    article: "Policy CP-1: no emails to competitors"
    explanation: Emails to competitor domains are not allowed.

  - id: max_discount
    kind: max_discount
    applies_to: [tool_call]
    tools: [send_email]
    max_percent: 20
    decision: block
    severity: medium
    framework: Company policy
    article: "Policy CP-2: discounts max 20%"
    explanation: Sales may not offer discounts above 20% without approval.

judge:
  applies_to: [tool_call]
  severity_default: medium
